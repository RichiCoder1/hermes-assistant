[project]
name = "hermes-assistant-dev"
version = "0.5.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "aiohttp==3.14.4",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "ty>=0.0.84",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
